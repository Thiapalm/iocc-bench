iocc:
  address: 0x20
  verbose: false
  i2c_speed_hz: 400000 #in Hz
  reset_on_open: false
  timeout: 10 # in milliseconds

bench:
  address: 0x20
  verbose: false
  i2c_speed_hz: 400000 #in Hz
  reset_on_open: false
  timeout: 10 # in milliseconds
  ignition:
    # `iocc bench set` saves the new port/pin/direction/logic here
    # Available ports:
    #   porta
    #   portb
    port: portb
    # Available pins:
    #   pin0 to pin7
    pin: pin1
    # Available directions:
    #   input
    #   output
    direction: output
    # Inverted logic (active low). The bench relay is normally closed, so this
    # defaults to true: ON drives the pin low and OFF drives it high.
    #   false: normal (ON = high)
    #   true:  inverted (ON = low)
    inverted: true
