[package]
name = "iocc-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "iocc plugin that controls a bench ignition output through the MCP2221"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
mcp2221 = "0.1.1"

# `iocc-bus` is not published on crates.io yet. Point at the branch that
# contains the crate (currently `tui`); after the release, use the matching tag.
iocc-bus = { git = "https://github.com/Thiapalm/iocc", branch = "tui" }
